version: '3'
services:
  cod-database:
    container_name: cod-ts-database
    image: cod-ts-database
    build:
      context: .
      dockerfile: docker/db.dockerfile
    environment:
      POSTGRES_PASSWORD: mysecretpassword
  cod-application:
    container_name: cod-ts-application
    image: cod-ts-application
    build:
      context: .
      dockerfile: docker/app.dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@cod-database:5432/postgres
    ports:
      - "8080:4567"
    depends_on:
      - cod-database
    healthcheck:
      test: wget localhost:4567/ -q -O - > /dev/null 2>&1
      interval: 60s
      timeout: 5s
      retries: 5
